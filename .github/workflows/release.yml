name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (Ubuntu 26.04 container, x86_64)
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential curl ca-certificates pkg-config git
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Version tag matches Cargo.toml
        run: |
          v=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml v$v"; exit 1; }
      - run: cargo test --workspace --locked
      - run: cargo build --release --workspace --locked
      - run: scripts/package.sh "$GITHUB_REF_NAME" target/release
      - run: scripts/package-deb.sh "$GITHUB_REF_NAME" target/release
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/*
          if-no-files-found: error

  build-windows:
    name: build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
      - run: cargo build --release --workspace --locked
      - name: Package (zip + Inno Setup installer)
        shell: pwsh
        run: scripts/package-windows.ps1 -Tag $env:GITHUB_REF_NAME -BinDir target\release
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS-windows
          if-no-files-found: error

  publish:
    name: publish GitHub Release
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist
      - name: Merge and verify checksums
        run: |
          cd dist
          cat SHA256SUMS-windows >> SHA256SUMS
          rm SHA256SUMS-windows
          sha256sum -c SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "SD Backup Manager $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            dist/*.deb dist/*.tar.gz dist/install.sh \
            dist/sd-backup-manager-setup-x64.exe dist/*windows.zip dist/SHA256SUMS
